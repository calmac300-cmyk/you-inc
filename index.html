<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f0c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>You, Inc.</title>
<style>
:root{--bg:#0b0f0c;--panel:#131a15;--panel2:#18211b;--line:#223027;--text:#e6efe8;--dim:#7f9186;--up:#2bd47d;--down:#ff5c5c;--amber:#ffb84d;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(70px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;min-width:0}
.wrap{max-width:520px;margin:0 auto;padding:0 14px}
.mono{font-family:var(--mono)}
.dim{color:var(--dim)}
.up{color:var(--up)}.down{color:var(--down)}.amber{color:var(--amber)}
h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:22px 0 8px;font-weight:600}

/* ticker */
header.tick{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 0 8px}
.tick-row{display:flex;align-items:center;gap:10px}
.sym{font:700 13px var(--mono);color:var(--amber)}
.px{font:700 26px var(--mono);letter-spacing:-.02em}
.chg{font:600 14px var(--mono)}
.tick-row svg{margin-left:auto}
.tick-meta{display:flex;justify-content:space-between;gap:10px;font:12px var(--mono);color:var(--dim);margin-top:4px}
.headline{font-size:13px;margin-top:6px;min-height:2.6em;color:#cfdad2}
.headline b{color:var(--amber);font-weight:600}

/* cards */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;position:relative}
.seg{text-align:left;width:100%;min-height:118px;display:flex;flex-direction:column;gap:4px}
.seg:active{background:var(--panel2)}
.seg .name{font-weight:600}
.seg .prog{font:700 22px var(--mono)}
.seg .prog small{font-size:13px;color:var(--dim);font-weight:400}
.seg .unit{font-size:12px;color:var(--dim)}
.seg.done{border-color:#2bd47d55}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:auto}
.bar i{display:block;height:100%;background:var(--up)}
.bar.behind i{background:var(--down)}
.tag{font:600 10px var(--mono);letter-spacing:.06em;padding:2px 6px;border-radius:4px;background:var(--line);color:var(--dim)}
.tag.today{background:#2bd47d22;color:var(--up)}
.tag.bold{background:#ffb84d22;color:var(--amber)}
.tag.sandbag{background:#ff5c5c22;color:var(--down)}
.flash{position:absolute;top:36px;right:10px;font:700 14px var(--mono);animation:fl 1.4s forwards}
@keyframes fl{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
.cap-row{display:flex;gap:6px;margin-top:6px}
.cap-row input{width:64px;padding:6px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-weight:600}
.btn.sm{padding:5px 9px;font-size:13px;border-radius:8px}
.btn.primary{background:var(--amber);color:#1a1205;border-color:var(--amber)}
.btn.wide{width:100%;padding:14px;font-size:16px}
.btn:disabled{opacity:.4}
.link{color:var(--dim);font-size:12px;text-decoration:underline}
.discs{display:flex;flex-wrap:wrap;gap:8px}
.disc{border:1px solid #ff5c5c55;color:#ffb3b3;border-radius:999px;padding:7px 12px;font-size:13px}
.disc:active{background:#ff5c5c22}
.banner{background:#ffb84d14;border:1px solid #ffb84d44;border-radius:12px;padding:10px 12px;margin-top:14px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.list{background:var(--panel);border:1px solid var(--line);border-radius:14px}
.list .row{display:flex;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);font-size:14px}
.list .row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.feed .row{align-items:flex-start}
.feed .who{font-weight:600;font-size:12px}
.feed time{font:11px var(--mono);color:var(--dim);white-space:nowrap}
.x{color:var(--dim);font-size:18px;padding:0 4px}

/* funds */
.fund{margin-bottom:10px}
.fund .top{display:flex;justify-content:space-between;align-items:baseline}
.fund .fname{font-weight:700}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:8px 0 4px}
.meter i{display:block;height:100%}
.fund .quote{font-size:13px;color:#cfdad2;margin-top:6px;font-style:italic}

/* call */
.stamp{font:800 11px var(--mono);letter-spacing:.08em;padding:3px 7px;border-radius:4px;border:1.5px solid}
.stamp.BEAT{color:var(--up)}.stamp.MISS{color:var(--down)}.stamp.IN{color:var(--amber)}
.big{font:700 34px var(--mono)}
.step{display:flex;align-items:center;gap:8px}
.step .btn{width:34px;height:34px;padding:0}
.step .val{font:700 18px var(--mono);min-width:28px;text-align:center}
label.moon{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:4px}

/* setup */
.seg-edit{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px;border-top:1px solid var(--line)}
.seg-edit:first-child{border-top:0}
.seg-edit label{font-size:11px;color:var(--dim);display:flex;flex-direction:column;gap:3px}
.seg-edit .full{grid-column:1/-1}

nav{position:fixed;bottom:0;left:0;right:0;background:#0b0f0cf2;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;max-width:130px;padding:12px 0 14px;font-size:13px;color:var(--dim);font-weight:600}
nav button.on{color:var(--amber)}
nav button .dot{display:inline-block;width:6px;height:6px;border-radius:3px;background:var(--amber);margin-left:4px;vertical-align:middle}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222c25;border:1px solid var(--line);padding:10px 14px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:9}
#toast.on{opacity:1}
</style>
</head>
<body>
<header class="tick"><div class="wrap" id="ticker"></div></header>
<main class="wrap" id="main"></main>
<nav id="nav"></nav>
<div id="toast"></div>
<script>
const KEY = 'youinc-v1';
const HOUR = 3600e3, DAY = 24 * HOUR, WEEK = 7 * DAY;
const CALL_OPENS = 6 * HOUR;               // before nominal end (Fri 6pm)
const AUTO_REPORT = 2 * DAY + 9 * HOUR;    // after nominal end (Mon 9am)

const FUNDS = [
  {id:'sloth', name:'Sloth Capital', vice:'Laziness', color:'#a395ff'},
  {id:'gluttony', name:'Gluttony Partners', vice:'Overeating', color:'#ff9f43'},
  {id:'doom', name:'Doomscroll Holdings', vice:'Distraction', color:'#ff5c8a'},
  {id:'ignorant', name:'Ignorant Inc.', vice:'Not learning', color:'#2ec4b6'},
];

// type: count = +1 per tap, daily = once per day, cap = nightly hours, a day counts if under cap
const DEFAULT_SEGMENTS = [
  {id:'training', name:'Training', unit:'workouts', type:'count', fund:'sloth', weight:1, base:3, active:true},
  {id:'mobility', name:'Mobility', unit:'walk days', type:'daily', fund:'sloth', weight:1, base:4, active:true},
  {id:'screen', name:'Screen time', unit:'days under cap', type:'cap', cap:3, fund:'doom', weight:1, base:4, active:true},
  {id:'nutrition', name:'Nutrition', unit:'good days', type:'daily', fund:'gluttony', weight:1, base:4, active:true},
  {id:'language', name:'Language', unit:'study days', type:'daily', fund:'ignorant', weight:1, base:3, active:true},
  {id:'reading', name:'Reading', unit:'reading days', type:'daily', fund:'ignorant', weight:1, base:4, active:true, milestone:'Finished a book'},
];

const DISCLOSURES = [
  {id:'snack', label:'Late snack', fund:'gluttony'},
  {id:'skipwork', label:'Skipped workout', fund:'sloth'},
  {id:'binge', label:'Binge scroll', fund:'doom'},
  {id:'limit', label:'App limit disabled', fund:'doom'},
  {id:'skipstudy', label:'Skipped study', fund:'ignorant'},
];

const LINES = {
  sloth: {
    open: ["Opened a short on {segs}. See you Wednesday, when you quit.", "{segs} guidance noted. We've seen this movie. Short."],
    openBold: ["Ambitious guidance on {segs}. Adorable. Doubling the usual short."],
    disclosure: ["A skipped workout. Shocking. Truly. *yawns*", "Filed and noted. The couch thanks you for your loyalty."],
    behind: ["Behind pace on {segs}. Right on schedule.", "Told the desk you'd fade by midweek. Desk owes me lunch."],
    ahead: ["Ahead of pace on {segs}? Probably a glitch.", "...Fine. A good start. Starts are cheap."],
    midweek: ["Adding to our {segs} short. It's Wednesday. You know what happens Wednesday."],
    gloat: ["As expected. Effort is overrated and you proved it.", "Another week, another nap. Profitable."],
    retract: ["We... retract our view on {segs}. Temporarily.", "Covered the short at a loss. Please don't make this a pattern."],
    cut: ["Guidance cut. Lowering the bar is our favorite exercise."],
    doubledown: ["Raising {segs} on a Thursday? Bold of you. Adding to the short."],
    skip: ["Didn't even show up to your own call. We respect that, honestly."],
  },
  gluttony: {
    open: ["Short on {segs}, and a reservation for Friday. We're feeling festive!", "Lovely guidance on {segs}! We've already ordered dessert."],
    openBold: ["Such strict {segs} guidance! We'll bring snacks to the call for when it slips."],
    disclosure: ["A late snack! Oh, you shouldn't have. Truly, a gift.", "Disclosure received with gratitude. Seconds, anyone?"],
    behind: ["The kitchen's always open, friend. Behind pace on {segs}!"],
    ahead: ["Hmm. Salads. How dreary of you."],
    midweek: ["Topping up our {segs} short. Wednesday is pizza night, after all."],
    gloat: ["What a feast of a week! Thank you for dining with us.", "Profits all round! Pass the gravy."],
    retract: ["Well. We'll skip dessert this week. Retracting on {segs}.", "Our compliments to the chef, regrettably. Short covered."],
    cut: ["Guidance cut! More room on the plate."],
    doubledown: ["More discipline? You're spoiling the party. Adding to the short."],
    skip: ["Skipped the call? Too full to come? We understand completely."],
  },
  doom: {
    open: ["HOT TAKE: {segs} guidance is a TOP. Short initiated.", "Just charted your {segs}. Head-and-shoulders. Shorting it LIVE."],
    openBold: ["BOLD {segs} guidance?? In THIS market?? Mega short. Thread below."],
    disclosure: ["BREAKING: discipline collapses. Called it. Called it!!", "Another disclosure?? Massive. Absolutely massive. Love to see it."],
    behind: ["{segs} breaking support. Volume is HUGE. I'm screaming."],
    ahead: ["Ok this {segs} rally is fake. Totally fake. Probably."],
    midweek: ["Adding to the {segs} short. Wednesday dip incoming, it's in the chart."],
    gloat: ["Called it Monday. Called it Wednesday. Victory lap.", "Bag secured. Hot take confirmed."],
    retract: ["Deleting my {segs} thread. It never happened.", "Ok so the chart was... upside down. Short covered."],
    cut: ["GUIDANCE CUT. This is the capitulation candle."],
    doubledown: ["Raised {segs} guidance?? Pure euphoria. Adding."],
    skip: ["No call?? CEO missing?? Unprecedented. Posting now."],
  },
  ignorant: {
    open: ["Short on {segs}. Books are just heavy furniture.", "Flashcards? In this economy? Short."],
    openBold: ["Ambitious {segs} guidance. Big words. We don't read big words."],
    disclosure: ["Skipped study. Knowledge is a trap and you avoided it. Nice.", "Disclosure filed. Learning is optional, and you opted out."],
    behind: ["{segs} behind pace. Ignorance compounding beautifully."],
    ahead: ["Ahead on {segs}. Nerd."],
    midweek: ["Adding to the {segs} short. Nobody finishes a book on a Wednesday."],
    gloat: ["We knew you wouldn't learn. We didn't learn either. Profitable.", "Another week, nothing learned. Our favorite outcome."],
    retract: ["Fine. You studied. We retract, whatever retract means.", "Short covered on {segs}. We had to look up 'covered'."],
    cut: ["Guidance cut. Smart. Well, not smart. You know what we mean."],
    doubledown: ["More studying? Gross. Adding to the short."],
    skip: ["Skipped the call. We also don't attend things. Respect."],
    milestone: ["A whole book? We're... reviewing our position.", "Finished a book. Disgusting. Retreating slightly."],
  },
};
const GENERIC = {milestone: ["A milestone. Noted, reluctantly."]};

// ---------- utils ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pick = a => a[Math.floor(Math.random() * a.length)];
const dkey = t => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const money = v => '$' + v.toFixed(2);
const pct = v => (v >= 0 ? '+' : '') + (v * 100).toFixed(1) + '%';
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function nextSat(t) { const d = new Date(t); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + (((6 - d.getDay()) + 7) % 7 || 7)); return d.getTime(); }
function plusWeek(t) { const d = new Date(t); d.setDate(d.getDate() + 7); return d.getTime(); }
function until(ms) { if (ms <= 0) return 'now'; const d = Math.floor(ms / DAY), h = Math.floor(ms % DAY / HOUR), m = Math.floor(ms % HOUR / 60e3); return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`; }
function clock(t) { return new Date(t).toLocaleString([], {weekday:'short', hour:'numeric', minute:'2-digit'}); }

// ---------- state ----------
let S = load();
let tab = 'floor', flash = null, draft = null;

function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v === 1) return s; } catch (e) {}
  return fresh();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Could not save. Export a backup.'); } }
function fresh() {
  const now = Date.now();
  const segments = DEFAULT_SEGMENTS.map(s => ({...s}));
  let nominalEnd = nextSat(now);
  if (nominalEnd - now < 2 * DAY) nominalEnd = plusWeek(nominalEnd);
  const frac = Math.min(1, (nominalEnd - now) / WEEK);
  const guidance = {};
  segments.forEach(s => guidance[s.id] = {target: Math.max(1, Math.round(s.base * frac)), baseline: s.base * frac, moonshot: false});
  return {
    v: 1, segments, logs: [], feed: [{ts: now, fund: null, text: 'IPO day. $CAL lists at $100.00. Tune your first guidance on the Call tab.'}],
    weeks: [{n: 1, start: now, end: null, nominalEnd, open: 100, guidance, midweek: {}, status: {}, free: true}],
    pending: false, booksClosed: null,
  };
}

const fundById = id => FUNDS.find(f => f.id === id);
const segById = id => S.segments.find(s => s.id === id);
const cur = () => { const w = S.weeks[S.weeks.length - 1]; return w && !w.end ? w : null; };
const last = () => S.weeks[S.weeks.length - 1];
const live = w => S.segments.filter(s => s.active && w.guidance[s.id]);

// ---------- price model ----------
function wlogs(w, t = Infinity) { const e = w.end ?? Infinity; return S.logs.filter(l => l.ts >= w.start && l.ts < e && l.ts <= t); }
function progress(w, s, t) {
  const ls = wlogs(w, t).filter(l => l.seg === s.id && l.kind === 'progress');
  if (s.type === 'cap') return ls.filter(l => l.value <= (+s.cap || 0)).length;
  return ls.reduce((a, l) => a + l.value, 0);
}
function share(w, t) { return clamp((t - w.start) / (w.nominalEnd - w.start), 0, 1); }
// deficit/surplus vs. where you should be by now, as a fraction of guidance; = share × (pace − 1)
function term(w, s, t) { const g = w.guidance[s.id].target; if (g <= 0) return 0; return clamp((progress(w, s, t) - g * share(w, t)) / g, -1, 1); }
const boldness = g => clamp(g.target / Math.max(g.baseline, 0.5), 0.25, 3);
function bold(w, s) { return boldness(w.guidance[s.id]); }
function wavg(segs, f) { let sw = 0, sv = 0; segs.forEach(s => { const k = +s.weight || 0; sw += k; sv += k * f(s); }); return sw ? sv / sw : 0; }
function counts(w, t, fund) {
  const ls = wlogs(w, t).filter(l => !fund || l.fund === fund);
  return {disc: ls.filter(l => l.kind === 'disclosure').length, cuts: ls.filter(l => l.kind === 'cut').length, ms: ls.filter(l => l.kind === 'milestone').length};
}
function adj(c) { return Math.pow(0.995, c.disc) * Math.pow(0.97, c.cuts) * Math.pow(1.02, c.ms); }
function priceAt(w, t) {
  if (w.end && t >= w.end) return w.close;
  return w.open * (1 + 0.10 * wavg(live(w), s => term(w, s, t))) * adj(counts(w, t));
}
function fundView(w, f, t) {
  const segs = live(w).filter(s => s.fund === f.id);
  const avgTerm = mean(segs.map(s => term(w, s, t)));
  const disc = counts(w, t, f.id).disc;
  const smug = clamp(Math.round(50 - 100 * avgTerm + 10 * disc), 0, 100);
  let pos = segs.length ? 5 * mean(segs.map(s => bold(w, s))) : 1;
  if (w.midweek[f.id]) pos *= 1.5;
  pos += disc * 0.5;
  return {segs, avgTerm, smug, pos, disc};
}
function baseline(s) {
  const hist = S.weeks.filter(w => w.results && w.results.some(r => r.seg === s.id)).slice(-4);
  if (!hist.length) return s.base;
  return mean(hist.map(w => w.results.find(r => r.seg === s.id).actual / clamp((w.end - w.start) / WEEK, 0.3, 1.3)));
}

// ---------- feed ----------
function say(fid, ev, segs, t = Date.now()) {
  const bank = (LINES[fid] && LINES[fid][ev]) || GENERIC[ev];
  if (!bank) return;
  const names = (segs || []).map(s => s.name).join(' & ') || 'you';
  S.feed.push({ts: t, fund: fid, text: pick(bank).replace(/\{segs\}/g, names)});
  if (S.feed.length > 80) S.feed = S.feed.slice(-80);
}
function evaluate() {
  const w = cur(); if (!w) return;
  const t = Date.now(), midweekAt = w.nominalEnd - (2 * DAY + 6 * HOUR);
  FUNDS.forEach(f => {
    const v = fundView(w, f, t); if (!v.segs.length) return;
    if (t >= midweekAt && !(f.id in w.midweek)) { w.midweek[f.id] = v.avgTerm < -0.05; if (w.midweek[f.id]) say(f.id, 'midweek', v.segs.filter(s => term(w, s, t) < 0)); }
    const st = v.avgTerm < -0.15 ? 'behind' : v.avgTerm > 0.1 ? 'ahead' : null;
    if (st && st !== w.status[f.id]) { w.status[f.id] = st; say(f.id, st, v.segs); }
  });
}

// ---------- week lifecycle ----------
function settle(w, t, held) {
  w.end = t; w.held = held;
  w.results = live(w).map(s => {
    const g = w.guidance[s.id], actual = progress(w, s), r = g.target > 0 ? actual / g.target : 1, B = bold(w, s);
    let stamp, move;
    if (r >= 1) { stamp = 'BEAT'; move = 0.05 * B * B * (1 + Math.min(r - 1, 0.5)); if (g.moonshot) move *= 2; if (B < 0.9) move = Math.min(move, 0.01); }
    else if (r >= 0.9) { stamp = 'IN LINE'; move = 0; }
    else { stamp = 'MISS'; move = -0.04 * B * (1 + (0.9 - r)); if (g.moonshot) move *= 1.5; }
    return {seg: s.id, name: s.name, unit: s.unit, fund: s.fund, weight: +s.weight || 0, target: g.target, street: Math.round(g.target * 0.6), actual, r, B, moonshot: g.moonshot, stamp, move};
  });
  const sw = w.results.reduce((a, r) => a + r.weight, 0) || 1;
  w.eps = w.results.reduce((a, r) => a + r.weight * Math.min(r.r, 1.5), 0) / sw;
  w.raw = clamp(w.results.reduce((a, r) => a + r.weight * r.move, 0) / sw, -0.25, 0.25);
  w.close = w.open * (1 + w.raw) * adj(counts(w));
  w.funds = FUNDS.map(f => {
    const rs = w.results.filter(r => r.fund === f.id); if (!rs.length) return null;
    const v = fundView(w, f, t), avgMove = mean(rs.map(r => r.move));
    const pnl = v.pos * -avgMove * 10 + v.disc * 0.5;
    const won = pnl > 0.05;
    const segs = rs.map(r => ({name: r.name}));
    const bank = LINES[f.id][held ? (won ? 'gloat' : 'retract') : 'skip'];
    const text = pick(bank).replace(/\{segs\}/g, segs.map(s => s.name).join(' & '));
    S.feed.push({ts: t, fund: f.id, text});
    return {fund: f.id, pos: v.pos, pnl, won, text};
  }).filter(Boolean);
}
function openWeek(prev, guidance, t) {
  const w = {n: prev.n + 1, start: prev.end, end: null, nominalEnd: plusWeek(prev.nominalEnd), open: prev.close, guidance, midweek: {}, status: {}};
  S.weeks.push(w); S.pending = false;
  FUNDS.forEach(f => {
    const segs = live(w).filter(s => s.fund === f.id); if (!segs.length) return;
    say(f.id, mean(segs.map(s => bold(w, s))) > 1.15 ? 'openBold' : 'open', segs, t);
  });
  return w;
}
function defaultGuidance(carry) {
  const g = {};
  S.segments.filter(s => s.active).forEach(s => {
    const b = baseline(s), prev = carry && carry[s.id];
    g[s.id] = {target: prev ? prev.target : Math.max(1, Math.round(b)), baseline: b, moonshot: prev ? prev.moonshot : false};
  });
  return g;
}
function catchUp() {

    }
