<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>You, Inc.</title>
<style>
:root{--bg:#050706;--panel:#0b0f0d;--panel2:#121a16;--line:#1d2822;--text:#d9e4dd;--dim:#6c8076;--up:#1fe08a;--down:#ff4a4a;--amber:#ffaf1a;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:13.5px/1.45 var(--mono)}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:var(--text);background:#000;border:1px solid var(--line);border-radius:2px;padding:8px;min-width:0}
input:focus,select:focus{outline:none;border-color:var(--amber)}
.wrap{max-width:520px;margin:0 auto;padding:0 12px}
.dim{color:var(--dim)}.up{color:var(--up)}.down{color:var(--down)}.amber{color:var(--amber)}
.grow{flex:1;min-width:0}
h2{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin:20px 0 6px;font-weight:600}
h2::after{content:"";flex:1;border-top:1px solid var(--line)}

/* ticker */
header.tick{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--amber);padding-top:env(safe-area-inset-top)}
.tick-row{display:flex;align-items:center;gap:10px;padding:10px 0 6px}
.sym{font-weight:700;font-size:12px;color:#000;background:var(--amber);padding:1px 5px}
.px{font-weight:700;font-size:28px;letter-spacing:-.02em;padding:0 4px;margin:0 -4px}
.px.blink-up{animation:bu .9s}.px.blink-down{animation:bd .9s}
@keyframes bu{0%,35%{background:var(--up);color:#000}100%{background:transparent}}
@keyframes bd{0%,35%{background:var(--down);color:#000}100%{background:transparent}}
.chg{font-weight:600;font-size:13px}
.tick-row svg{margin-left:auto}
.tape{overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -12px;white-space:nowrap;font-size:11px;background:#000;text-transform:uppercase}
.tape-in{display:inline-block;padding:4px 0;animation:tape 45s linear infinite}
.ti{padding:0 14px;border-right:1px solid var(--line)}
@keyframes tape{to{transform:translateX(-50%)}}
.tick-meta{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--dim);margin-top:6px;text-transform:uppercase;letter-spacing:.04em}
.headline{font-size:12.5px;margin:4px 0 8px;min-height:2.9em;color:#c4d1c9;display:flex;gap:8px;align-items:flex-start}
.headline b{font-weight:700;letter-spacing:.05em}

/* segments */
.panel{border:1px solid var(--line);background:var(--panel)}
.srow{position:relative;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.stap{display:grid;grid-template-columns:1fr auto 84px 14px;align-items:center;column-gap:10px;row-gap:2px;width:100%;text-align:left;padding:11px 12px;transition:background .15s,transform .08s}
button.stap:active{background:var(--panel2);transform:scale(.985)}
.sn{font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow.done .sn::before{content:"✓ ";color:var(--up)}
.sv{font-weight:700;font-size:17px;text-align:right}
.sv i{font-style:normal;color:var(--dim);font-size:12px;font-weight:400}
.ss{grid-column:1/-1;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.03em}
.blocks{display:block;height:9px;position:relative;background:repeating-linear-gradient(90deg,var(--line) 0 5px,transparent 5px 7px)}
.blocks i{position:absolute;top:0;bottom:0;left:0;background:repeating-linear-gradient(90deg,var(--c,var(--amber)) 0 5px,transparent 5px 7px);transition:width .4s}
.sx{display:flex;gap:6px;padding:0 12px 11px}
.sx input{flex:1;padding:7px}
.kbtn{border:1px solid var(--line);background:#000;padding:6px 10px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);border-radius:2px;transition:transform .08s}
.kbtn:active{transform:scale(.96);background:var(--panel2)}
.flash{position:absolute;top:34px;right:12px;font-weight:700;font-size:12px;padding:1px 5px;animation:fl 1.4s forwards;pointer-events:none;z-index:2}
.flash.up{background:var(--up);color:#000}.flash.down{background:var(--down);color:#000}
@keyframes fl{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}

.btn{background:var(--panel2);border:1px solid var(--line);border-radius:2px;padding:9px 12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:12px;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.sm{padding:6px 9px;font-size:11px}
.btn.primary{background:var(--amber);color:#000;border-color:var(--amber)}
.btn.wide{width:100%;padding:14px;font-size:14px}
.btn:disabled{opacity:.4}
.discs{display:flex;flex-wrap:wrap;gap:6px}
.disc{border:1px solid #ff4a4a66;color:#ff8a8a;padding:7px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;border-radius:2px;transition:transform .08s}
.disc::before{content:"▼ "}
.disc:active{background:var(--down);color:#000;transform:scale(.96)}
.banner{border:1px solid var(--line);border-left:3px solid var(--amber);background:var(--panel);padding:9px 10px;margin-top:12px;font-size:12.5px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner b{color:var(--amber);text-transform:uppercase;letter-spacing:.04em}
.list{background:var(--panel);border:1px solid var(--line)}
.list .row{display:flex;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line);font-size:12.5px}
.list .row:first-child{border-top:0}
.feed .row{align-items:flex-start}
.who{font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.feed time{font-size:10.5px;color:var(--dim);white-space:nowrap}
.x{color:var(--dim);font-size:16px;padding:0 4px}
.av{flex:none;display:block}
.tag{font-weight:600;font-size:10px;letter-spacing:.06em;padding:1px 5px;border:1px solid var(--line);color:var(--dim)}
.tag.bold{color:var(--amber);border-color:#ffaf1a66}
.tag.sandbag{color:var(--down);border-color:#ff4a4a66}
.card{background:var(--panel);border:1px solid var(--line);padding:12px}
.caps{font-size:11px;text-transform:uppercase;letter-spacing:.04em}

/* funds */
.fund{border:1px solid var(--line);background:var(--panel);padding:12px;margin-bottom:8px}
.fhead{display:flex;gap:12px;align-items:center}
.fname{font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.fsub{font-size:11px;color:var(--dim);text-transform:uppercase}
.fpos{text-align:right;font-weight:700;font-size:16px;white-space:nowrap}
.fpos small{display:block;font-size:10px;color:var(--dim);font-weight:400;letter-spacing:.08em}
.fmeter{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin-top:10px;font-size:11px;color:var(--dim);text-transform:uppercase}
.quote{font-size:12.5px;color:#c4d1c9;margin-top:8px;border-left:2px solid var(--line);padding-left:8px}

/* call */
.stamp{font-weight:700;font-size:11px;letter-spacing:.1em;padding:3px 7px;border:3px double;transform:rotate(-4deg);display:inline-block;white-space:nowrap}
.stamp.BEAT{color:var(--up)}.stamp.MISS{color:var(--down)}.stamp.IN{color:var(--amber)}
.big{font-weight:700;font-size:38px;letter-spacing:-.02em}
.anim .stamp{opacity:0;animation:stamp .4s var(--d) cubic-bezier(.2,.9,.3,1.3) forwards}
.anim .reveal{opacity:0;animation:rise .4s var(--d) forwards}
@keyframes stamp{0%{opacity:0;transform:scale(2.6) rotate(-14deg)}100%{opacity:1;transform:scale(1) rotate(-4deg)}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.step{display:flex;align-items:center;gap:6px}
.step .btn{width:34px;height:34px;padding:0;font-size:16px}
.step .val{font-weight:700;font-size:17px;min-width:28px;text-align:center}
label.moon{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:4px;text-transform:uppercase;margin-top:3px}

/* setup */
.seg-edit{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px;border-top:1px solid var(--line)}
.seg-edit:first-child{border-top:0}
.seg-edit label{font-size:10.5px;color:var(--dim);display:flex;flex-direction:column;gap:3px;text-transform:uppercase;letter-spacing:.04em}
.seg-edit .full{grid-column:1/-1}

nav{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid var(--amber);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;max-width:130px;padding:8px 0 11px;font-size:11px;color:var(--dim);font-weight:600;letter-spacing:.08em;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button b{font-size:10px;padding:0 4px;border:1px solid var(--line);color:var(--dim);font-weight:700}
nav button.on{color:var(--amber)}
nav button.on b{background:var(--amber);color:#000;border-color:var(--amber)}
nav button .dot{display:inline-block;width:6px;height:6px;background:var(--amber);margin-left:4px;vertical-align:middle;animation:pulse 1.2s infinite alternate}
@keyframes pulse{to{opacity:.2}}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#000;border:1px solid var(--line);border-left:3px solid var(--amber);padding:9px 12px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:9;text-transform:uppercase;letter-spacing:.03em}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.tape-in,.flash,.px,nav .dot{animation:none!important}.anim .stamp,.anim .reveal{animation:none!important;opacity:1!important}}
</style>
</head>
<body>
<header class="tick"><div class="wrap" id="ticker"></div></header>
<main class="wrap" id="main"></main>
<nav id="nav"></nav>
<div id="toast"></div>
<script>
const KEY = 'youinc-v1';
const HOUR = 3600e3, DAY = 24 * HOUR, WEEK = 7 * DAY;
const CALL_OPENS = 6 * HOUR;               // before nominal end (Fri 6pm)
const AUTO_REPORT = 2 * DAY + 9 * HOUR;    // after nominal end (Mon 9am)
const BACKUP_NUDGE = 14 * DAY;

const FUNDS = [
  {id:'sloth', name:'Sloth Capital', vice:'Laziness', color:'#a395ff'},
  {id:'gluttony', name:'Gluttony Partners', vice:'Overeating', color:'#ff9f43'},
  {id:'doom', name:'Doomscroll Holdings', vice:'Distraction', color:'#ff5c8a'},
  {id:'ignorant', name:'Ignorant Inc.', vice:'Not learning', color:'#2ec4b6'},
];

// type: count = +1 per tap, daily = once per day, cap = nightly hours, a day counts if under cap
const DEFAULT_SEGMENTS = [
  {id:'training', name:'Training', unit:'workouts', type:'count', fund:'sloth', weight:1, base:3, active:true},
  {id:'mobility', name:'Mobility', unit:'walk days', type:'daily', fund:'sloth', weight:1, base:4, active:true},
  {id:'screen', name:'Screen time', unit:'days under cap', type:'cap', cap:3, fund:'doom', weight:1, base:4, active:true},
  {id:'nutrition', name:'Nutrition', unit:'good days', type:'daily', fund:'gluttony', weight:1, base:4, active:true},
  {id:'language', name:'Language', unit:'study days', type:'daily', fund:'ignorant', weight:1, base:3, active:true},
  {id:'reading', name:'Reading', unit:'reading days', type:'daily', fund:'ignorant', weight:1, base:4, active:true, milestone:'Finished a book'},
];

const DISCLOSURES = [
  {id:'snack', label:'Late snack', fund:'gluttony'},
  {id:'skipwork', label:'Skipped workout', fund:'sloth'},
  {id:'binge', label:'Binge scroll', fund:'doom'},
  {id:'limit', label:'App limit disabled', fund:'doom'},
  {id:'skipstudy', label:'Skipped study', fund:'ignorant'},
];

const LINES = {
  sloth: {
    open: ["Opened a short on {segs}. See you Wednesday, when you quit.", "{segs} guidance noted. We've seen this movie. Short."],
    openBold: ["Ambitious guidance on {segs}. Adorable. Doubling the usual short."],
    disclosure: ["A skipped workout. Shocking. Truly. *yawns*", "Filed and noted. The couch thanks you for your loyalty."],
    behind: ["Behind pace on {segs}. Right on schedule.", "Told the desk you'd fade by midweek. Desk owes me lunch."],
    ahead: ["Ahead of pace on {segs}? Probably a glitch.", "...Fine. A good start. Starts are cheap."],
    midweek: ["Adding to our {segs} short. It's Wednesday. You know what happens Wednesday."],
    gloat: ["As expected. Effort is overrated and you proved it.", "Another week, another nap. Profitable."],
    retract: ["We... retract our view on {segs}. Temporarily.", "Covered the short at a loss. Please don't make this a pattern."],
    cut: ["Guidance cut. Lowering the bar is our favorite exercise."],
    doubledown: ["Raising {segs} on a Thursday? Bold of you. Adding to the short."],
    skip: ["Didn't even show up to your own call. We respect that, honestly."],
  },
  gluttony: {
    open: ["Short on {segs}, and a reservation for Friday. We're feeling festive!", "Lovely guidance on {segs}! We've already ordered dessert."],
    openBold: ["Such strict {segs} guidance! We'll bring snacks to the call for when it slips."],
    disclosure: ["A late snack! Oh, you shouldn't have. Truly, a gift.", "Disclosure received with gratitude. Seconds, anyone?"],
    behind: ["The kitchen's always open, friend. Behind pace on {segs}!"],
    ahead: ["Hmm. Salads. How dreary of you."],
    midweek: ["Topping up our {segs} short. Wednesday is pizza night, after all."],
    gloat: ["What a feast of a week! Thank you for dining with us.", "Profits all round! Pass the gravy."],
    retract: ["Well. We'll skip dessert this week. Retracting on {segs}.", "Our compliments to the chef, regrettably. Short covered."],
    cut: ["Guidance cut! More room on the plate."],
    doubledown: ["More discipline? You're spoiling the party. Adding to the short."],
    skip: ["Skipped the call? Too full to come? We understand completely."],
  },
  doom: {
    open: ["HOT TAKE: {segs} guidance is a TOP. Short initiated.", "Just charted your {segs}. Head-and-shoulders. Shorting it LIVE."],
    openBold: ["BOLD {segs} guidance?? In THIS market?? Mega short. Thread below."],
    disclosure: ["BREAKING: discipline collapses. Called it. Called it!!", "Another disclosure?? Massive. Absolutely massive. Love to see it."],
    behind: ["{segs} breaking support. Volume is HUGE. I'm screaming."],
    ahead: ["Ok this {segs} rally is fake. Totally fake. Probably."],
    midweek: ["Adding to the {segs} short. Wednesday dip incoming, it's in the chart."],
    gloat: ["Called it Monday. Called it Wednesday. Victory lap.", "Bag secured. Hot take confirmed."],
    retract: ["Deleting my {segs} thread. It never happened.", "Ok so the chart was... upside down. Short covered."],
    cut: ["GUIDANCE CUT. This is the capitulation candle."],
    doubledown: ["Raised {segs} guidance?? Pure euphoria. Adding."],
    skip: ["No call?? CEO missing?? Unprecedented. Posting now."],
  },
  ignorant: {
    open: ["Short on {segs}. Books are just heavy furniture.", "Flashcards? In this economy? Short."],
    openBold: ["Ambitious {segs} guidance. Big words. We don't read big words."],
    disclosure: ["Skipped study. Knowledge is a trap and you avoided it. Nice.", "Disclosure filed. Learning is optional, and you opted out."],
    behind: ["{segs} behind pace. Ignorance compounding beautifully."],
    ahead: ["Ahead on {segs}. Nerd."],
    midweek: ["Adding to the {segs} short. Nobody finishes a book on a Wednesday."],
    gloat: ["We knew you wouldn't learn. We didn't learn either. Profitable.", "Another week, nothing learned. Our favorite outcome."],
    retract: ["Fine. You studied. We retract, whatever retract means.", "Short covered on {segs}. We had to look up 'covered'."],
    cut: ["Guidance cut. Smart. Well, not smart. You know what we mean."],
    doubledown: ["More studying? Gross. Adding to the short."],
    skip: ["Skipped the call. We also don't attend things. Respect."],
    milestone: ["A whole book? We're... reviewing our position.", "Finished a book. Disgusting. Retreating slightly."],
  },
};
const GENERIC = {milestone: ["A milestone. Noted, reluctantly."]};

// ---------- utils ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pick = a => a[Math.floor(Math.random() * a.length)];
const dkey = t => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const money = v => '$' + v.toFixed(2);
const pct = v => (v >= 0 ? '+' : '') + (v * 100).toFixed(1) + '%';
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function nextSat(t) { const d = new Date(t); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + (((6 - d.getDay()) + 7) % 7 || 7)); return d.getTime(); }
function plusWeek(t) { const d = new Date(t); d.setDate(d.getDate() + 7); return d.getTime(); }
function until(ms) { if (ms <= 0) return 'now'; const d = Math.floor(ms / DAY), h = Math.floor(ms % DAY / HOUR), m = Math.floor(ms % HOUR / 60e3); return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`; }
function clock(t) { return new Date(t).toLocaleString([], {weekday:'short', hour:'numeric', minute:'2-digit'}); }

// ---------- state ----------
let S = load();
let tab = 'floor', flash = null, draft = null;

function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v === 1) return s; } catch (e) {}
  return fresh();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Could not save. Export a backup.'); } }
function fresh() {
  const now = Date.now();
  const segments = DEFAULT_SEGMENTS.map(s => ({...s}));
  let nominalEnd = nextSat(now);
  if (nominalEnd - now < 2 * DAY) nominalEnd = plusWeek(nominalEnd);
  const frac = Math.min(1, (nominalEnd - now) / WEEK);
  const guidance = {};
  segments.forEach(s => guidance[s.id] = {target: Math.max(1, Math.round(s.base * frac)), baseline: s.base * frac, moonshot: false});
  return {
    v: 1, segments, logs: [], feed: [{ts: now, fund: null, text: 'IPO day. $CAL lists at $100.00. Tune your first guidance on the Call tab.'}],
    weeks: [{n: 1, start: now, end: null, nominalEnd, open: 100, guidance, midweek: {}, status: {}, free: true}],
    pending: false, booksClosed: null,
  };
}

const fundById = id => FUNDS.find(f => f.id === id);
const segById = id => S.segments.find(s => s.id === id);
const cur = () => { const w = S.weeks[S.weeks.length - 1]; return w && !w.end ? w : null; };
const last = () => S.weeks[S.weeks.length - 1];
const live = w => S.segments.filter(s => s.active && w.guidance[s.id]);

// ---------- price model ----------
function wlogs(w, t = Infinity) { const e = w.end ?? Infinity; return S.logs.filter(l => l.ts >= w.start && l.ts < e && l.ts <= t); }
function progress(w, s, t) {
  const ls = wlogs(w, t).filter(l => l.seg === s.id && l.kind === 'progress');
  if (s.type === 'cap') return ls.filter(l => l.value <= (+s.cap || 0)).length;
  return ls.reduce((a, l) => a + l.value, 0);
}
function share(w, t) { return clamp((t - w.start) / (w.nominalEnd - w.start), 0, 1); }
// deficit/surplus vs. where you should be by now, as a fraction of guidance; = share × (pace − 1)
function term(w, s, t) { const g = w.guidance[s.id].target; if (g <= 0) return 0; return clamp((progress(w, s, t) - g * share(w, t)) / g, -1, 1); }
const boldness = g => clamp(g.target / Math.max(g.baseline, 0.5), 0.25, 3);
function bold(w, s) { return boldness(w.guidance[s.id]); }
function wavg(segs, f) { let sw = 0, sv = 0; segs.forEach(s => { const k = +s.weight || 0; sw += k; sv += k * f(s); }); return sw ? sv / sw : 0; }
function counts(w, t, fund) {
  const ls = wlogs(w, t).filter(l => !fund || l.fund === fund);
  return {disc: ls.filter(l => l.kind === 'disclosure').length, cuts: ls.filter(l => l.kind === 'cut').length, ms: ls.filter(l => l.kind === 'milestone').length};
}
function adj(c) { return Math.pow(0.995, c.disc) * Math.pow(0.97, c.cuts) * Math.pow(1.02, c.ms); }
function priceAt(w, t) {
  if (w.end && t >= w.end) return w.close;
  return w.open * (1 + 0.10 * wavg(live(w), s => term(w, s, t))) * adj(counts(w, t));
}
function fundView(w, f, t) {
  const segs = live(w).filter(s => s.fund === f.id);
  const avgTerm = mean(segs.map(s => term(w, s, t)));
  const disc = counts(w, t, f.id).disc;
  const smug = clamp(Math.round(50 - 100 * avgTerm + 10 * disc), 0, 100);
  let pos = segs.length ? 5 * mean(segs.map(s => bold(w, s))) : 1;
  if (w.midweek[f.id]) pos *= 1.5;
  pos += disc * 0.5;
  return {segs, avgTerm, smug, pos, disc};
}
function baseline(s) {
  const hist = S.weeks.filter(w => w.results && w.results.some(r => r.seg === s.id)).slice(-4);
  if (!hist.length) return s.base;
  return mean(hist.map(w => w.results.find(r => r.seg === s.id).actual / clamp((w.end - w.start) / WEEK, 0.3, 1.3)));
}

// ---------- feed ----------
function say(fid, ev, segs, t = Date.now()) {
  const bank = (LINES[fid] && LINES[fid][ev]) || GENERIC[ev];
  if (!bank) return;

      <div class="fmeter"><span>Smug</span>${blocks(v.smug / 100, f.color)}<span style="color:${f.color}">${v.smug} ${mood}</span></div>
      ${lastLine ? `<div class="quote">“${esc(lastLine.text)}”</div>` : ''}</div>`;
  });
  const closes = [100, ...S.weeks.filter(x => x.close != null).map(x => x.close)];
  if (!S.pending) closes.push(priceAt(w, now));
  const allTime = Math.max(...closes);
  h += `<h2>$CAL since IPO</h2><div class="card"><div style="display:flex;justify-content:space-between"><b>${money(closes[closes.length - 1])}</b><span class="dim caps">ATH ${money(allTime)}</span></div>
    <div style="margin-top:8px">${spark(closes, 300, 70, '#ffaf1a').replace('width="300"', 'width="100%"')}</div>
    <div class="dim caps" style="margin-top:4px">${S.weeks.length} week${S.weeks.length > 1 ? 's' : ''} listed</div></div>`;
  h += `<h2>Full wire</h2>${feedList(40)}`;
  return h;
}
function boldTag(B) { return B < 0.9 ? '<span class="tag sandbag">SANDBAG</span>' : B > 1.15 ? '<span class="tag bold">BOLD</span>' : '<span class="tag">SAFE</span>'; }
function countTo(el, from, to, ms, cls) {
  const t0 = Date.now();
  (function frame() {
    if (!el.isConnected) return;
    const k = Math.min(1, (Date.now() - t0) / ms), e = 1 - Math.pow(1 - k, 3);
    el.textContent = money(from + (to - from) * e);
    if (k < 1) setTimeout(frame, 16); else { el.className = 'big ' + cls; buzz(to >= from ? [40, 60, 120] : 200); revealAt = 0; renderTicker(); }
  })(t0);
}
function renderCall() {
  const now = Date.now();
  if (S.pending) {
    const w = last();
    if (!draft) draft = defaultGuidance(w.guidance);
    const anim = callAnim && !reduceMotion(); callAnim = false;
    const ch = w.close / w.open - 1, cls = ch >= 0 ? 'up' : 'down';
    const STEP = 0.55, tPrice = w.results.length * STEP + 0.4, tFunds = tPrice + 1.9;
    if (anim) revealAt = Date.now() + (tPrice + 3) * 1000; // fallback if the count never finishes
    const verdict = w.raw > 0 ? 'BEAT' : w.raw < 0 ? 'MISS' : 'IN LINE';
    let h = `<div class="${anim ? 'anim' : ''}"><h2>Week ${w.n} earnings call</h2><div class="card">
      <div class="dim caps">Score (EPS) ${w.eps.toFixed(2)} · <span class="reveal" style="--d:${tPrice + 1.5}s">${verdict}</span></div>
      <div class="big ${anim ? 'dim' : cls}" id="closePx">${money(anim ? w.open : w.close)}</div>
      <div class="${cls} reveal" style="--d:${tPrice + 1.5}s">${pct(ch)} after hours <span class="dim">from ${money(w.open)}</span></div></div>`;
    h += `<h2>Segment results</h2><div class="list">${w.results.map((r, i) => `<div class="row reveal" style="--d:${i * STEP}s"><div class="grow"><b>${esc(r.name)}</b>${r.moonshot ? ' <span class="tag bold">MOON</span>' : ''}
      <div class="dim" style="font-size:11px">GUID ${r.target} · STREET ${r.street} · ACTUAL ${r.actual}</div></div>
      <span class="${r.move > 0 ? 'up' : r.move < 0 ? 'down' : 'dim'}" style="font-size:12px">${pct(r.move)}</span>
      <span class="stamp ${r.stamp.split(' ')[0]}" style="--d:${i * STEP + 0.25}s">${r.stamp}</span></div>`).join('')}</div>`;
    h += `<h2>Short positions</h2><div class="list">${w.funds.map((f, j) => { const fd = fundById(f.fund); return `<div class="row reveal" style="--d:${tFunds + j * 0.35}s">${avatar(f.fund, 32)}<div class="grow"><div class="who" style="color:${fd.color}">${esc(fd.name)} · <span class="${f.pnl > 0 ? 'down' : 'up'}">${f.pnl > 0 ? '+' : '−'}$${Math.abs(f.pnl).toFixed(1)}M</span></div>${esc(f.text)}</div></div>`; }).join('')}</div>`;
    h += `<div class="reveal" style="--d:${tFunds + w.funds.length * 0.35 + 0.3}s"><h2>Guidance for week ${w.n + 1}</h2><div class="list">${S.segments.filter(s => s.active).map(s => {
      const g = draft[s.id], B = boldness(g);
      return `<div class="row"><div class="grow"><b>${esc(s.name)}</b> ${boldTag(B)}<div class="dim" style="font-size:11px">BASELINE ${g.baseline.toFixed(1)} ${esc(s.unit)}</div>
        <label class="moon"><input type="checkbox" ${g.moonshot ? 'checked' : ''} data-a="dmoon" data-id="${s.id}"> Moonshot (2× up, 1.5× down)</label></div>
        <div class="step"><button class="btn" data-a="dstep" data-id="${s.id}" data-d="-1">−</button><span class="val">${g.target}</span><button class="btn" data-a="dstep" data-id="${s.id}" data-d="1">+</button></div></div>`;
    }).join('')}</div>
    <p class="dim" style="font-size:12px">Bold guidance pays roughly B² on a beat. Sandbagging (below 0.9× baseline) caps the upside at +1%.</p>
    <button class="btn primary wide" data-a="lock">Lock in guidance</button></div></div>`;
    if (anim) after.push(() => {
      w.results.forEach((r, i) => setTimeout(() => buzz(r.stamp === 'MISS' ? [50, 40, 50] : r.stamp === 'BEAT' ? 30 : 10), (i * STEP + 0.25) * 1000));
      const el = document.getElementById('closePx');
      setTimeout(() => countTo(el, w.open, w.close, 1500, cls), tPrice * 1000);
    });
    return h;
  }
  const w = cur(), open = now >= w.nominalEnd - CALL_OPENS;
  let h = open
    ? `<h2>Week ${w.n} earnings call</h2><div class="card"><p style="margin:0 0 12px">The call is open. Results settle when you hold it; anything logged until then counts. It auto-reports ${clock(w.nominalEnd + AUTO_REPORT)}.</p><button class="btn primary wide" data-a="hold">Hold the call</button></div>`
    : `<h2>Next earnings call</h2><div class="card"><div class="big">${until(w.nominalEnd - CALL_OPENS - now)}</div><div class="dim caps">opens ${clock(w.nominalEnd - CALL_OPENS)}</div></div>`;
  h += `<h2>Week ${w.n} guidance</h2><div class="list">${live(w).map(s => {
    const g = w.guidance[s.id];
    return `<div class="row"><div class="grow"><b>${esc(s.name)}</b> ${boldTag(bold(w, s))}<div class="dim" style="font-size:11px">${progress(w, s, now)} / ${g.target} ${esc(s.unit)} · STREET ${Math.round(g.target * 0.6)}</div>
      ${w.free ? `<label class="moon"><input type="checkbox" ${g.moonshot ? 'checked' : ''} data-a="moon" data-id="${s.id}"> Moonshot</label>` : g.moonshot ? '<span class="tag bold">MOON</span>' : ''}</div>
      <div class="step"><button class="btn" data-a="step" data-id="${s.id}" data-d="-1">−</button><span class="val">${g.target}</span><button class="btn" data-a="step" data-id="${s.id}" data-d="1">+</button></div></div>`;
  }).join('')}</div>
  <p class="dim" style="font-size:12px">${w.free ? 'IPO week: change guidance freely.' : 'Cutting guidance costs 3%. Raising it (double down) unlocks Thursday for a segment already at 100%.'}</p>`;
  return h;
}
function renderSetup() {
  const fundOpts = v => FUNDS.map(f => `<option value="${f.id}" ${f.id === v ? 'selected' : ''}>${esc(f.name)}</option>`).join('');
  const typeOpts = v => [['count', 'Count (tap +1)'], ['daily', 'Once a day'], ['cap', 'Hours under a cap']].map(([k, l]) => `<option value="${k}" ${k === v ? 'selected' : ''}>${l}</option>`).join('');
  const w = cur();
  let h = `<h2>Segments</h2><p class="dim" style="font-size:12px;margin-top:0">${w && w.free
    ? 'IPO week: the starting baseline also sets this week\'s target.'
    : 'Baseline changes count from next week. This week\'s targets live on the Call tab.'}</p><div class="list">${S.segments.map(s => `<div class="seg-edit" style="${s.active ? '' : 'opacity:.5'}">
    <label class="full">Name<input data-seg="${s.id}" data-field="name" value="${esc(s.name)}"></label>
    <label>Unit<input data-seg="${s.id}" data-field="unit" value="${esc(s.unit)}"></label>
    <label>Logging<select data-seg="${s.id}" data-field="type">${typeOpts(s.type)}</select></label>
    <label>Shorted by<select data-seg="${s.id}" data-field="fund">${fundOpts(s.fund)}</select></label>
    <label>Weight<input type="number" step="0.5" min="0" data-seg="${s.id}" data-field="weight" value="${s.weight}"></label>
    <label>Starting baseline / wk<input type="number" step="1" min="0" data-seg="${s.id}" data-field="base" value="${s.base}"></label>
    ${s.type === 'cap' ? `<label>Cap (hours)<input type="number" step="0.5" min="0" data-seg="${s.id}" data-field="cap" value="${s.cap ?? 3}"></label>` : '<span></span>'}
    <div class="full"><button class="btn sm" data-a="retire" data-id="${s.id}">${s.active ? 'Retire' : 'Reinstate'}</button></div></div>`).join('')}</div>
    <p style="margin-top:10px"><button class="btn sm" data-a="addSeg">+ Add segment</button></p>
    <h2>Backup</h2><p class="dim" style="font-size:12px;margin-top:0">Everything lives in this browser on this device. Last backup: ${S.lastExport ? `${new Date(S.lastExport).toLocaleDateString([], {month: 'short', day: 'numeric'})} (${Math.floor((Date.now() - S.lastExport) / DAY)} days ago)` : 'never'}. The Floor reminds you after two weeks.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" data-a="exportData">Export backup</button><button class="btn sm" data-a="importData">Import backup</button><button class="btn sm" style="color:var(--down)" data-a="reset">Reset</button></div>
    <input type="file" id="imp" accept="application/json,.json" hidden>`;
  return h;
}
function render() {
  renderTicker();
  const views = {floor: renderFloor, funds: renderFunds, call: renderCall, setup: renderSetup};
  document.getElementById('main').innerHTML = views[tab]() + '<div style="height:20px"></div>';
  const w = last(), callDot = S.pending || Date.now() >= w.nominalEnd - CALL_OPENS;
  document.getElementById('nav').innerHTML = [['floor', 'Floor'], ['funds', 'Funds'], ['call', 'Call'], ['setup', 'Setup']]
    .map(([k, l], i) => `<button class="${tab === k ? 'on' : ''}" data-a="tab" data-id="${k}"><b>F${i + 1}</b><span>${l.toUpperCase()}${k === 'call' && callDot ? '<span class="dot"></span>' : ''}</span></button>`).join('');
  after.splice(0).forEach(f => f());
}
let toastT;
function toast(m) { const el = document.getElementById('toast'); el.textContent = m; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2200); }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a; if (!A[a]) return;
  if (b.type === 'checkbox') e.preventDefault();
  A[a](b.dataset.id, b.dataset.d ? +b.dataset.d : undefined);
});
document.addEventListener('input', e => { if (e.target.dataset.seg && e.target.tagName === 'INPUT') editSeg(e.target); });
document.addEventListener('change', e => {
  if (e.target.dataset.seg && e.target.tagName === 'SELECT') editSeg(e.target);
  if (e.target.id === 'imp' && e.target.files[0]) {
    e.target.files[0].text().then(t => {
      try { const s = JSON.parse(t); if (s.v !== 1 || !s.weeks) throw 0; if (!confirm('Replace everything with this backup?')) return; S = s; save(); render(); toast('Backup restored.'); }
      catch (err) { toast('That file is not a You, Inc. backup.'); }
    });
  }
});

catchUp(); evaluate(); save(); render();
setInterval(() => { hlIdx++; catchUp(); evaluate(); renderTicker(); }, 6000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { catchUp(); evaluate(); render(); } });
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
